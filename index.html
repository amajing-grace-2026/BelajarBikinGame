<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Web Bros 2D - Running Banner Edition</title>
    <style>
        body {
            margin: 0; padding: 0;
            display: flex; justify-content: center; align-items: center;
            height: 100vh; background-color: #111;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            user-select: none;
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 400px;
        }
        canvas {
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border-radius: 8px;
            image-rendering: pixelated; 
            outline: none;
            background-color: #5c94fc;
        }
        /* SPANDUK TEKS BERJALAN */
        #running-banner {
            position: absolute;
            top: 0; left: 0;
            width: 800px;
            height: 24px;
            background: rgba(0, 0, 0, 0.5);
            overflow: hidden;
            white-space: nowrap;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
            pointer-events: none;
            z-index: 15;
            display: flex;
            align-items: center;
        }
        .banner-text {
            display: inline-block;
            padding-left: 100%;
            color: #FFD700;
            font-weight: bold;
            font-size: 13px;
            text-shadow: 1px 1px 2px #000;
            animation: marquee 14s linear infinite;
        }
        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        #ui-layer {
            position: absolute; top: 30px;
            width: 760px; left: 20px;
            display: flex; justify-content: space-between;
            color: white; font-weight: bold; font-size: 15px;
            text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
            pointer-events: none;
            z-index: 10;
        }
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; justify-content: center; align-items: center;
            background-color: rgba(0, 0, 0, 0.85);
            z-index: 20; color: #FFD700; font-weight: bold; font-size: 28px;
            text-shadow: 3px 3px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
            text-align: center; flex-direction: column; line-height: 1.6;
            cursor: pointer;
            display: none;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- TEKS BERJALAN ATAS -->
        <div id="running-banner">
            <span class="banner-text">game ini dibuat hanya untuk Belajar AI</span>
        </div>

        <div id="ui-layer">
            <div id="scoreDisplay">SKOR: 0</div>
            <div id="levelDisplay">LEVEL: 1</div>
            <div id="livesDisplay">NYAWA: 3</div>
            <div id="statusDisplay">A/D: Gerak | W: Lompat | F / Shift: Tembak Api | S: Masuk Pipa</div>
        </div>
        
        <div id="center-message" class="overlay"></div>

        <canvas id="gameCanvas" width="800" height="400" tabindex="1"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const levelDisplay = document.getElementById('levelDisplay');
        const livesDisplay = document.getElementById('livesDisplay');
        const centerMsg = document.getElementById('center-message');

        let gameState = 'playing'; 
        let currentZone = 'main';  
        let transitionPipe = null; 
        let score = 0;
        let lives = 3;
        let currentLevel = 1;
        const maxLevel = 4;
        let cameraX = 0;
        let levelWidth = 3000;
        let skyColor = '#5c94fc';
        let creditsY = 420;

        const gravity = 0.65;
        const friction = 0.8;
        
        let player = { 
            x: 50, y: 50, w: 32, h: 42, velX: 0, velY: 0, jumpPower: -15.5, grounded: false, facing: 1, walkFrame: 0, 
            powerState: 0 
        };

        const keys = {};

        function shootFireball() {
            let activeCount = fireballs.filter(fb => fb.zone === currentZone).length;
            if (activeCount >= 3) return;
            
            fireballs.push({
                x: player.facing > 0 ? player.x + player.w : player.x - 12,
                y: player.y + player.h / 2 - 6,
                w: 12, h: 12,
                velX: player.facing * 7,
                velY: 2,
                zone: currentZone
            });
        }

        function handleActionRestart() {
            if (gameState === 'level_clear') {
                currentLevel++;
                startGame(false);
            } else if (gameState === 'respawn') {
                respawnLevel();
            } else if (gameState === 'gameover' || gameState === 'credits') {
                currentLevel = 1;
                startGame(true);
            }
        }

        window.addEventListener('keydown', e => {
            let code = e.code || ""; let key = e.key || "";
            keys[code] = true; keys[key] = true; keys[key.toLowerCase()] = true;

            if ((code === 'KeyF' || key.toLowerCase() === 'f' || code === 'ShiftLeft' || code === 'ShiftRight' || code === 'KeyJ' || key.toLowerCase() === 'j') && gameState === 'playing' && player.powerState === 2) {
                shootFireball();
            }

            if (code === 'Enter' || key === 'Enter' || code === 'Space' || key === ' ') {
                handleActionRestart();
            }
        });
        
        window.addEventListener('keyup', e => {
            let code = e.code || ""; let key = e.key || "";
            keys[code] = false; keys[key] = false; keys[key.toLowerCase()] = false;
        });

        canvas.addEventListener('click', handleActionRestart);
        centerMsg.addEventListener('click', handleActionRestart);

        let platforms = [], coins = [], enemies = [], items = [], clouds = [], debris = [], fireballs = [];
        let flagpole = { x: 2700, y: 50, w: 12, h: 300 };

        function addBrickRow(x, y, count, zone='main') {
            for(let i=0; i<count; i++) {
                platforms.push({ x: x + (i * 40), y: y, w: 40, h: 40, type: 'brick', zone: zone });
            }
        }

        function loadLevel() {
            platforms = []; coins = []; enemies = []; items = []; clouds = []; debris = []; fireballs = [];
            currentZone = 'main';
            
            if (currentLevel === 1) {
                skyColor = '#5c94fc'; 
                levelWidth = 3000; flagpole = { x: 2800, y: 50, w: 12, h: 300 };
                for(let i=0; i<20; i++) clouds.push({ x: Math.random()*levelWidth, y: Math.random()*150+20, size: Math.random()*20+20, color: 'rgba(255, 255, 255, 0.7)' });

                platforms = [
                    { x: 0, y: 350, w: 1000, h: 50, type: 'ground' }, { x: 1100, y: 350, w: 600, h: 50, type: 'ground' }, { x: 1900, y: 350, w: 1100, h: 50, type: 'ground' },
                    { x: 350, y: 220, w: 40, h: 40, type: 'question', item: 'coin', hit: false }, 
                    { x: 390, y: 220, w: 40, h: 40, type: 'question', item: 'mushroom', hit: false },
                    { x: 430, y: 220, w: 40, h: 40, type: 'question', item: 'flower', hit: false },
                    { x: 470, y: 220, w: 40, h: 40, type: 'brick' }, 
                ];
                addBrickRow(600, 120, 3); 
                platforms.push(
                    { x: 1300, y: 240, w: 40, h: 110, type: 'solid' },
                    { x: 800, y: 250, w: 60, h: 100, type: 'pipe', enterable: true, destZone: 'dungeon', destX: 50, destY: 50 }, 
                    { x: 2500, y: 250, w: 60, h: 100, type: 'pipe' }, 
                    { x: 2200, y: 230, w: 80, h: 120, type: 'solid' }, { x: 2280, y: 150, w: 80, h: 200, type: 'solid' }, { x: 2360, y: 70, w: 80, h: 280, type: 'solid' }
                );
                coins = [ { x: 640, y: 70 }, { x: 1550, y: 100 } ];
                enemies = [ { x: 700, y: 310, velX: -1.2, minX: 500, maxX: 850 }, { x: 1200, y: 310, velX: 1.2, minX: 1100, maxX: 1450 } ];
                
                platforms.push({ x: 0, y: 350, w: 800, h: 50, type: 'solid', zone: 'dungeon' }, { x: -40, y: 0, w: 40, h: 400, type: 'solid', zone: 'dungeon' }, { x: 800, y: 0, w: 40, h: 400, type: 'solid', zone: 'dungeon' }, { x: 700, y: 250, w: 60, h: 100, type: 'pipe', enterable: true, destZone: 'main', destX: 2514, destY: 200, zone: 'dungeon' });
                coins.push( { x: 200, y: 250, zone: 'dungeon' }, { x: 250, y: 200, zone: 'dungeon' }, { x: 300, y: 150, zone: 'dungeon' }, { x: 350, y: 150, zone: 'dungeon' }, { x: 400, y: 200, zone: 'dungeon' }, { x: 450, y: 250, zone: 'dungeon' } );

            } else if (currentLevel === 2) {
                skyColor = '#111122'; 
                levelWidth = 3500; flagpole = { x: 3300, y: 50, w: 12, h: 300 };
                for(let i=0; i<30; i++) clouds.push({ x: Math.random()*levelWidth, y: Math.random()*300, size: Math.random()*10+5, color: 'rgba(255, 255, 255, 0.1)' });
                platforms = [
                    { x: 0, y: 350, w: 600, h: 50, type: 'ground' }, { x: 750, y: 350, w: 120, h: 50, type: 'ground' }, { x: 1000, y: 350, w: 1500, h: 50, type: 'ground' }, { x: 2650, y: 350, w: 850, h: 50, type: 'ground' },
                    { x: 1000, y: 10, w: 900, h: 30, type: 'solid' }, { x: 1200, y: 270, w: 50, h: 80, type: 'solid' }, { x: 1400, y: 220, w: 50, h: 130, type: 'solid' }
                ];
                addBrickRow(1650, 260, 2); 
                addBrickRow(1850, 180, 5); 
                platforms.push(
                    { x: 1050, y: 250, w: 60, h: 100, type: 'pipe', enterable: true, destZone: 'dungeon', destX: 50, destY: 50 }, 
                    { x: 2300, y: 250, w: 60, h: 100, type: 'pipe' }, 
                    { x: 2800, y: 230, w: 80, h: 120, type: 'solid' }, { x: 2880, y: 150, w: 80, h: 200, type: 'solid' }, { x: 2960, y: 70, w: 80, h: 280, type: 'solid' },
                    { x: 400, y: 200, w: 40, h: 40, type: 'question', item: 'mushroom', hit: false },
                    { x: 1750, y: 180, w: 40, h: 40, type: 'question', item: 'flower', hit: false }
                );
                coins = [ { x: 790, y: 250 }, { x: 1890, y: 100 }, { x: 2250, y: 150 } ];
                enemies = [ { x: 400, y: 310, velX: -1.5, minX: 200, maxX: 550 }, { x: 1150, y: 310, velX: 1.5, minX: 1150, maxX: 1350 } ];

                platforms.push({ x: 0, y: 350, w: 800, h: 50, type: 'solid', zone: 'dungeon' }, { x: -40, y: 0, w: 40, h: 400, type: 'solid', zone: 'dungeon' }, { x: 800, y: 0, w: 40, h: 400, type: 'solid', zone: 'dungeon' }, { x: 700, y: 250, w: 60, h: 100, type: 'pipe', enterable: true, destZone: 'main', destX: 2314, destY: 200, zone: 'dungeon' });
                coins.push( { x: 200, y: 250, zone: 'dungeon' }, { x: 300, y: 150, zone: 'dungeon' }, { x: 400, y: 200, zone: 'dungeon' }, { x: 500, y: 150, zone: 'dungeon' } );
            
            } else if (currentLevel === 3) {
                skyColor = '#87CEEB'; 
                levelWidth = 4000; flagpole = { x: 3800, y: 50, w: 12, h: 300 };
                for(let i=0; i<40; i++) clouds.push({ x: Math.random()*levelWidth, y: Math.random()*350, size: Math.random()*30+10, color: 'rgba(255, 255, 255, 0.9)' });
                platforms = [
                    { x: 0, y: 350, w: 400, h: 50, type: 'ground' }, 
                    { x: 500, y: 180, w: 40, h: 40, type: 'question', item: 'mushroom', hit: false }, 
                    { x: 550, y: 250, w: 160, h: 40, type: 'solid' }, { x: 800, y: 150, w: 160, h: 40, type: 'solid' }, 
                    { x: 1100, y: 250, w: 200, h: 40, type: 'solid' }, 
                    { x: 1200, y: 120, w: 40, h: 40, type: 'question', item: 'mushroom', hit: false }, 
                    { x: 1450, y: 150, w: 160, h: 40, type: 'solid' }, 
                    { x: 1750, y: 250, w: 300, h: 40, type: 'solid' }, { x: 2200, y: 150, w: 120, h: 40, type: 'solid' }, 
                    { x: 2450, y: 250, w: 120, h: 40, type: 'solid' }, { x: 2700, y: 150, w: 120, h: 40, type: 'solid' }, 
                    { x: 2900, y: 350, w: 1200, h: 50, type: 'ground' },
                    { x: 1850, y: 120, w: 40, h: 40, type: 'question', item: 'flower', hit: false }
                ];
                coins = [ { x: 590, y: 200 }, { x: 840, y: 100 }, { x: 1150, y: 100 }, { x: 2240, y: 100 } ];
                enemies = [ { x: 1850, y: 210, velX: 2, minX: 1750, maxX: 2000 } ]; 

            } else if (currentLevel === 4) {
                skyColor = '#2B0000'; 
                levelWidth = 4500; flagpole = { x: 4300, y: 50, w: 12, h: 300 };
                for(let i=0; i<30; i++) clouds.push({ x: Math.random()*levelWidth, y: Math.random()*200, size: Math.random()*20+10, color: 'rgba(255, 69, 0, 0.2)' });
                platforms = [
                    { x: 0, y: 350, w: 500, h: 50, type: 'ground' }, 
                    { x: 0, y: 0, w: 4500, h: 40, type: 'solid' }, 
                    { x: 250, y: 220, w: 40, h: 40, type: 'question', item: 'mushroom', hit: false }, 
                    
                    { x: 620, y: 350, w: 300, h: 50, type: 'ground' }, 
                    { x: 1000, y: 250, w: 120, h: 40, type: 'solid' }, 
                    { x: 1100, y: 120, w: 40, h: 40, type: 'question', item: 'mushroom', hit: false }, 
                    { x: 1200, y: 150, w: 120, h: 40, type: 'solid' }, 
                    { x: 1400, y: 350, w: 500, h: 50, type: 'ground' }, 
                    { x: 1600, y: 200, w: 40, h: 150, type: 'solid' }, 
                    { x: 2000, y: 350, w: 200, h: 50, type: 'ground' }, 
                    { x: 2300, y: 250, w: 200, h: 50, type: 'ground' }, 
                    
                    { x: 2600, y: 350, w: 600, h: 50, type: 'ground' },
                    { x: 2800, y: 220, w: 40, h: 40, type: 'question', item: 'flower', hit: false }, 
                    { x: 3320, y: 350, w: 300, h: 50, type: 'ground' }, 
                    
                    { x: 3740, y: 280, w: 100, h: 70, type: 'solid' }, 
                    { x: 3840, y: 210, w: 100, h: 140, type: 'solid' }, 
                    { x: 3940, y: 140, w: 100, h: 210, type: 'solid' }, 
                    { x: 4040, y: 350, w: 500, h: 50, type: 'ground' }
                ];
                coins = [ { x: 1050, y: 190 }, { x: 1250, y: 90 }, { x: 2350, y: 190 } ];
                enemies = [ { x: 300, y: 310, velX: 2.5, minX: 100, maxX: 450 }, { x: 1500, y: 310, velX: 2.5, minX: 1450, maxX: 1800 }, { x: 2800, y: 310, velX: 3, minX: 2700, maxX: 3100 } ];
            }

            platforms.forEach(p => { if(!p.zone) p.zone = 'main'; p.destroyed = false; });
            coins.forEach(c => { c.zone = c.zone || 'main'; c.r = 12; c.collected = false; });
            enemies.forEach(e => { e.zone = e.zone || 'main'; e.w = 32; e.h = 32; e.dead = false; });
            clouds.forEach(c => { c.zone = c.zone || 'main'; });
        }

        function startGame(resetAll) {
            centerMsg.style.display = 'none';
            if (resetAll) { 
                player.powerState = 0; 
                player.h = 42; 
                score = 0; 
                lives = 3; 
            }
            player.x = 50; 
            player.y = (currentLevel === 3) ? -50 : 50; 
            player.velX = 0; player.velY = 0; player.facing = 1; player.walkFrame = 0;
            cameraX = 0; 
            gameState = 'playing';
            levelDisplay.innerText = "LEVEL: " + currentLevel;
            livesDisplay.innerText = "NYAWA: " + lives;
            loadLevel();
            canvas.focus();
        }

        function respawnLevel() {
            centerMsg.style.display = 'none';
            player.powerState = 0; 
            player.h = 42;
            player.x = 50;
            player.y = (currentLevel === 3) ? -50 : 50;
            player.velX = 0; player.velY = 0; player.facing = 1; player.walkFrame = 0;
            cameraX = 0;
            gameState = 'playing';
            livesDisplay.innerText = "NYAWA: " + lives;
            loadLevel();
            canvas.focus();
        }

        function checkCollision(r1, r2) {
            return r1.x < r2.x + r2.w && r1.x + r1.w > r2.x && r1.y < r2.y + r2.h && r1.y + r1.h > r2.y;
        }

        function update() {
            if (gameState === 'credits') {
                if (creditsY > 30) {
                    creditsY -= 1.0;
                }
                return;
            }

            if (gameState === 'pipe_transition') {
                player.y += 1.5; player.walkFrame = 0; 
                if (player.y > transitionPipe.y + player.h) {
                    currentZone = transitionPipe.destZone;
                    player.x = transitionPipe.destX; player.y = transitionPipe.destY;
                    player.velX = 0; player.velY = 0; gameState = 'playing'; cameraX = 0; 
                }
                return; 
            }

            if (gameState !== 'playing') return;

            if ((keys['ArrowDown'] || keys['KeyS'] || keys['s'] || keys['S']) && player.grounded) {
                let pxCenter = player.x + player.w / 2;
                for (let p of platforms) {
                    if (p.zone === currentZone && !p.destroyed && p.type === 'pipe' && p.enterable) {
                        if (pxCenter > p.x && pxCenter < p.x + p.w && Math.abs((player.y + player.h) - p.y) < 2) {
                            gameState = 'pipe_transition'; transitionPipe = p;
                            player.x = p.x + p.w / 2 - player.w / 2; player.velX = 0; return; 
                        }
                    }
                }
            }

            if (keys['ArrowRight'] || keys['KeyD'] || keys['d'] || keys['D']) { player.velX += 1.2; player.facing = 1; }
            if (keys['ArrowLeft'] || keys['KeyA'] || keys['a'] || keys['A']) { player.velX -= 1.2; player.facing = -1; }
            if ((keys['ArrowUp'] || keys['KeyW'] || keys['w'] || keys['W'] || keys['Space'] || keys[' ']) && player.grounded) {
                player.velY = player.jumpPower; player.grounded = false;
            }

            if (player.grounded && Math.abs(player.velX) > 0.5) { player.walkFrame += Math.abs(player.velX) * 0.15; } 
            else { player.walkFrame = 0; }

            player.velX *= friction; player.velY += gravity;

            let currentMapWidth = currentZone === 'main' ? levelWidth : 800;
            if (player.x > canvas.width / 2) cameraX = player.x - canvas.width / 2;
            if (cameraX < 0) cameraX = 0;
            if (cameraX > currentMapWidth - canvas.width) cameraX = currentMapWidth - canvas.width;

            player.x += player.velX;
            if (player.x < 0) player.x = 0;
            for (let p of platforms) {
                if (p.zone === currentZone && !p.destroyed && checkCollision(player, p)) {
                    if (player.velX > 0) player.x = p.x - player.w;
                    else if (player.velX < 0) player.x = p.x + p.w;
                    player.velX = 0;
                }
            }

            player.y += player.velY;
            player.grounded = false;
            for (let p of platforms) {
                if (p.zone === currentZone && !p.destroyed && checkCollision(player, p)) {
                    if (player.velY > 0) { 
                        player.y = p.y - player.h; player.grounded = true; player.velY = 0;
                    } else if (player.velY < 0) { 
                        player.y = p.y + p.h; player.velY = 0; 
                        
                        if (p.type === 'question' && p.item && !p.hit) {
                            p.hit = true; 
                            if (p.item === 'coin') {
                                score += 200; 
                            } else if (p.item === 'mushroom' || p.item === 'flower') {
                                items.push({ 
                                    x: p.x + 4, y: p.y - 32, w: 32, h: 32, 
                                    velX: 1.5, velY: 0, 
                                    type: p.item, 
                                    dead: false, zone: currentZone 
                                });
                            }
                        } 
                        else if (p.type === 'brick' && player.powerState > 0 && !p.item && !p.destroyed) {
                            p.destroyed = true; 
                            score += 50;
                            for(let i=0; i<4; i++) {
                                debris.push({
                                    x: p.x + 16, y: p.y + 16,
                                    vx: (Math.random() - 0.5) * 8, 
                                    vy: Math.random() * -6 - 4,    
                                    life: 40, zone: currentZone
                                });
                            }
                        }
                    }
                }
            }

            if (player.y > canvas.height) setGameOver(); 

            // Update Bola Api
            for (let i = fireballs.length - 1; i >= 0; i--) {
                let fb = fireballs[i];
                fb.velY += gravity * 0.5;
                fb.x += fb.velX;
                fb.y += fb.velY;

                for (let p of platforms) {
                    if (p.zone === currentZone && !p.destroyed && checkCollision(fb, p)) {
                        if (fb.velY > 0) {
                            fb.y = p.y - fb.h;
                            fb.velY = -8; 
                        } else {
                            fb.zone = 'dead'; 
                        }
                    }
                }

                for (let e of enemies) {
                    if (e.zone === currentZone && !e.dead && checkCollision(fb, e)) {
                        e.dead = true;
                        fb.zone = 'dead';
                        score += 300;
                    }
                }

                if (fb.x < cameraX || fb.x > cameraX + canvas.width || fb.y > canvas.height || fb.zone === 'dead') {
                    fireballs.splice(i, 1);
                }
            }

            for(let i = debris.length - 1; i >= 0; i--) {
                let d = debris[i];
                d.vy += gravity; d.x += d.vx; d.y += d.vy; d.life--;
                if (d.life <= 0 || d.y > canvas.height) debris.splice(i, 1);
            }

            for (let i = 0; i < items.length; i++) {
                let item = items[i];
                if (item.dead || item.zone !== currentZone) continue;
                
                if (item.type === 'mushroom') {
                    item.velY += gravity; item.x += item.velX;
                    for (let p of platforms) {
                        if (p.zone === currentZone && !p.destroyed && checkCollision(item, p)) {
                            if (item.velX > 0) item.x = p.x - item.w; else if (item.velX < 0) item.x = p.x + p.w;
                            item.velX *= -1; 
                        }
                    }
                    item.y += item.velY;
                    for (let p of platforms) {
                        if (p.zone === currentZone && !p.destroyed && checkCollision(item, p)) {
                            if (item.velY > 0) { item.y = p.y - item.h; item.velY = 0; }
                        }
                    }
                }

                if (checkCollision(player, item)) {
                    item.dead = true; score += 1000;
                    if (item.type === 'mushroom' && player.powerState === 0) {
                        player.powerState = 1; player.y -= 22; player.h = 64; 
                    } else if (item.type === 'flower' || player.powerState >= 1) {
                        player.powerState = 2; 
                        if (player.h === 42) { player.y -= 22; player.h = 64; }
                    }
                }
            }

            for (let c of coins) {
                if (c.zone === currentZone && !c.collected && checkCollision(player, {x: c.x - c.r, y: c.y - c.r, w: c.r*2, h: c.r*2})) {
                    c.collected = true; score += 100; 
                }
            }

            for (let e of enemies) {
                if (e.zone === currentZone && !e.dead) {
                    e.x += e.velX;
                    if (e.x < e.minX || e.x > e.maxX) e.velX *= -1;
                    if (checkCollision(player, e)) {
                        if (player.velY > 0 && player.y + player.h - player.velY <= e.y + e.h * 0.6) {
                            e.dead = true; player.velY = -10; score += 200; 
                        } else {
                            if (player.powerState > 0) {
                                player.powerState = 0; player.h = 42; player.y += 22; e.dead = true; 
                            } else {
                                setGameOver();
                            }
                        }
                    }
                }
            }

            if (currentZone === 'main' && checkCollision(player, flagpole)) {
                if (currentLevel < maxLevel) {
                    gameState = 'level_clear';
                    showCenterMessage("LEVEL " + currentLevel + " CLEAR! \nTekan ENTER atau Klik untuk lanjut.");
                } else {
                    gameState = 'credits';
                    creditsY = canvas.height + 20;
                    centerMsg.style.display = 'none';
                }
            }
            scoreDisplay.innerText = "SKOR: " + score;
        }

        function setGameOver() {
            lives--;
            livesDisplay.innerText = "NYAWA: " + lives;

            if (lives > 0) {
                gameState = 'respawn';
                showCenterMessage("KAMU MATI! \nSisa Nyawa: " + lives + "\nTekan ENTER atau Klik Layar untuk Coba Lagi di Level " + currentLevel + ".");
            } else {
                gameState = 'gameover';
                showCenterMessage("GAME OVER \nNyawa Habis! Tekan ENTER atau Klik Layar untuk Mengulang dari Level 1.");
            }
        }
        function showCenterMessage(msg) { centerMsg.innerText = msg; centerMsg.style.display = 'flex'; }

        // --- FUNGSI GAMBAR ELEMEN 2D ---

        function drawGroundBlock(x, y, w, h) {
            let baseColor = '#8B4513';
            let topColor = '#32CD32';
            if (currentLevel === 2) { baseColor = '#222233'; topColor = '#444466'; }
            if (currentLevel === 3) { baseColor = '#8B4513'; topColor = '#DAA520'; }
            if (currentLevel === 4) { baseColor = '#333333'; topColor = '#777777'; }

            ctx.fillStyle = baseColor;
            ctx.fillRect(x, y, w, h);
            ctx.fillStyle = topColor;
            ctx.fillRect(x, y, w, Math.min(12, h));
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.fillRect(x, y + Math.min(12, h), w, 3);
        }

        function drawBrickBlock(x, y, w, h, isHit) {
            if (isHit) {
                ctx.fillStyle = '#5C2E0B';
                ctx.fillRect(x, y, w, h);
                ctx.strokeStyle = '#3a1d07';
                ctx.lineWidth = 2;
                ctx.strokeRect(x, y, w, h);
                return;
            }

            let mainColor = '#c84c0c';
            let lineCol = '#5a2200';
            if (currentLevel === 2) { mainColor = '#2F4F4F'; lineCol = '#1c2e2e'; }
            if (currentLevel === 4) { mainColor = '#555555'; lineCol = '#222222'; }

            ctx.fillStyle = mainColor;
            ctx.fillRect(x, y, w, h);
            ctx.strokeStyle = lineCol;
            ctx.lineWidth = 2;
            ctx.strokeRect(x, y, w, h);

            ctx.beginPath();
            ctx.moveTo(x, y + h/2); ctx.lineTo(x + w, y + h/2);
            ctx.moveTo(x + w/2, y); ctx.lineTo(x + w/2, y + h/2);
            ctx.moveTo(x + w/4, y + h/2); ctx.lineTo(x + w/4, y + h);
            ctx.moveTo(x + 3*w/4, y + h/2); ctx.lineTo(x + 3*w/4, y + h);
            ctx.stroke();
        }

        function drawQuestionBlock(x, y, w, h, isHit) {
            if (isHit) {
                drawBrickBlock(x, y, w, h, true);
                return;
            }
            ctx.fillStyle = '#FFD700';
            ctx.fillRect(x, y, w, h);
            ctx.strokeStyle = '#B8860B';
            ctx.lineWidth = 3;
            ctx.strokeRect(x, y, w, h);

            ctx.fillStyle = '#000000';
            ctx.font = 'bold 22px monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('?', x + w/2, y + h/2);
            ctx.textAlign = 'left';
            ctx.textBaseline = 'alphabetic';
        }

        function drawPipe(x, y, w, h) {
            ctx.fillStyle = '#00AA00';
            ctx.fillRect(x + 4, y + 16, w - 8, Math.max(0, h - 16));
            ctx.fillStyle = '#00FF00';
            ctx.fillRect(x + 10, y + 16, 6, Math.max(0, h - 16));
            
            ctx.fillStyle = '#00AA00';
            ctx.fillRect(x, y, w, 16);
            ctx.fillStyle = '#00FF00';
            ctx.fillRect(x + 10, y, 6, 16);
            
            ctx.strokeStyle = '#004400';
            ctx.lineWidth = 2;
            ctx.strokeRect(x + 4, y + 16, w - 8, Math.max(0, h - 16));
            ctx.strokeRect(x, y, w, 16);
        }

        function draw() {
            if (gameState === 'credits') {
                ctx.fillStyle = '#000000'; 
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.textAlign = 'center';
                let startY = creditsY;

                ctx.fillStyle = '#FF2222';
                ctx.font = 'bold 32px Segoe UI, sans-serif';
                ctx.fillText("SUPER WEB BROS", canvas.width / 2, startY);

                ctx.fillStyle = '#FFD700';
                ctx.font = 'bold 18px Segoe UI, sans-serif';
                ctx.fillText("--- TERIMA KASIH TELAH MEMAINKAN! ---", canvas.width / 2, startY + 45);

                ctx.fillStyle = '#FFFFFF';
                ctx.font = '18px Segoe UI, sans-serif';
                ctx.fillText("Ide cerita : Victor Novan", canvas.width / 2, startY + 110);
                ctx.fillText("Penulis Kode : Gemini Plus", canvas.width / 2, startY + 150);
                ctx.fillText("Pembuat grafik : Gemini Plus", canvas.width / 2, startY + 190);
                ctx.fillText("Tester : Victor Novan", canvas.width / 2, startY + 230);

                ctx.fillStyle = '#00FF00';
                ctx.font = 'bold 20px Segoe UI, sans-serif';
                ctx.fillText("TEKAN [ENTER] UNTUK MENGULANG DARI LEVEL 1", canvas.width / 2, startY + 310);

                ctx.textAlign = 'left'; 
                return;
            }

            if (currentZone === 'dungeon') {
                ctx.fillStyle = '#000000'; 
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = skyColor; 
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.save(); ctx.translate(-cameraX * 0.3, 0); 
                for(let c of clouds) {
                    if (c.zone === 'main') {
                        ctx.fillStyle = c.color;
                        ctx.beginPath(); ctx.arc(c.x, c.y, c.size, 0, Math.PI * 2);
                        ctx.arc(c.x + c.size * 0.8, c.y - c.size * 0.4, c.size * 1.2, 0, Math.PI * 2);
                        ctx.arc(c.x + c.size * 1.6, c.y, c.size, 0, Math.PI * 2); ctx.fill();
                    }
                }
                ctx.restore();
            }

            ctx.save(); ctx.translate(-cameraX, 0);

            if (currentZone === 'main') {
                if (currentLevel === 4) {
                    ctx.fillStyle = '#CC0000'; ctx.fillRect(0, 380, levelWidth, 20); ctx.fillStyle = '#FF6600'; ctx.fillRect(0, 380, levelWidth, 5);  
                }
                ctx.fillStyle = '#D4AF37'; ctx.beginPath(); ctx.arc(flagpole.x + 6, flagpole.y - 10, 12, 0, Math.PI*2); ctx.fill(); 
                ctx.fillStyle = '#CCCCCC'; ctx.fillRect(flagpole.x, flagpole.y, flagpole.w, flagpole.h); 
                ctx.fillStyle = '#FF0000'; ctx.fillRect(flagpole.x - 50, flagpole.y + 10, 50, 20); 
                ctx.fillStyle = '#FFFFFF'; ctx.fillRect(flagpole.x - 50, flagpole.y + 30, 50, 20); 
                ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 1.5; ctx.strokeRect(flagpole.x - 50, flagpole.y + 10, 50, 40); 
            }

            for (let p of platforms) {
                if (p.zone !== currentZone || p.destroyed) continue; 
                if (p.type === 'ground') { drawGroundBlock(p.x, p.y, p.w, p.h); } 
                else if (p.type === 'brick' || p.type === 'solid') { drawBrickBlock(p.x, p.y, p.w, p.h, p.hit); } 
                else if (p.type === 'question') { drawQuestionBlock(p.x, p.y, p.w, p.h, p.hit); }
                else if (p.type === 'pipe') { drawPipe(p.x, p.y, p.w, p.h); }
            }

            for (let fb of fireballs) {
                if (fb.zone === currentZone) {
                    ctx.fillStyle = '#FF4500';
                    ctx.beginPath(); ctx.arc(fb.x + 6, fb.y + 6, 6, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#FFD700';
                    ctx.beginPath(); ctx.arc(fb.x + 6, fb.y + 6, 3, 0, Math.PI * 2); ctx.fill();
                }
            }

            for (let d of debris) {
                if (d.zone === currentZone) {
                    let dColor = '#c84c0c'; 
                    if (currentLevel === 2) dColor = '#2F4F4F'; 
                    if (currentLevel === 4) dColor = '#555555'; 
                    ctx.fillStyle = dColor; ctx.fillRect(d.x, d.y, 8, 8);
                }
            }

            for (let item of items) {
                if (item.zone === currentZone && !item.dead) {
                    if (item.type === 'mushroom') {
                        ctx.fillStyle = '#FF0000'; ctx.beginPath(); ctx.arc(item.x + item.w/2, item.y + 14, item.w/2, Math.PI, 0); ctx.fill();
                        ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(item.x + 8, item.y + 6, 3, 0, Math.PI*2); ctx.fill();
                        ctx.beginPath(); ctx.arc(item.x + 24, item.y + 6, 3, 0, Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(item.x + 16, item.y + 2, 3, 0, Math.PI*2); ctx.fill();
                        ctx.fillStyle = '#FFCC99'; ctx.fillRect(item.x + 8, item.y + 14, item.w - 16, item.h - 14);
                        ctx.fillStyle = 'black'; ctx.fillRect(item.x + 12, item.y + 18, 2, 4); ctx.fillRect(item.x + 18, item.y + 18, 2, 4);
                    } else if (item.type === 'flower') {
                        ctx.fillStyle = '#FF4500'; ctx.fillRect(item.x + 6, item.y + 6, 20, 20);
                        ctx.fillStyle = '#FFD700'; ctx.beginPath(); ctx.arc(item.x + 16, item.y + 16, 6, 0, Math.PI*2); ctx.fill();
                    }
                }
            }

            for (let c of coins) {
                if (c.zone === currentZone && !c.collected) {
                    ctx.fillStyle = '#FFD700'; ctx.beginPath(); ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#FFA500'; ctx.beginPath(); ctx.arc(c.x, c.y, c.r - 4, 0, Math.PI * 2); ctx.fill();
                }
            }

            for (let e of enemies) {
                if (e.zone === currentZone && !e.dead) {
                    let mCol = currentLevel === 4 ? '#8B0000' : (currentLevel === 2 || currentZone === 'dungeon' ? '#6B8E23' : '#CD853F'); 
                    let cCol = currentLevel === 4 ? '#FF4500' : (currentLevel === 2 || currentZone === 'dungeon' ? '#556B2F' : '#8B4513');
                    ctx.fillStyle = mCol; ctx.fillRect(e.x, e.y + 12, e.w, e.h - 12);
                    ctx.fillStyle = cCol; ctx.beginPath(); ctx.arc(e.x + e.w/2, e.y + 12, e.w/2, Math.PI, 0); ctx.fill();
                    ctx.fillStyle = 'white'; ctx.fillRect(e.x + 6, e.y + 14, 6, 8); ctx.fillRect(e.x + 20, e.y + 14, 6, 8);
                    ctx.fillStyle = 'black'; ctx.fillRect(e.x + 8, e.y + 16, 4, 4); ctx.fillRect(e.x + 20, e.y + 16, 4, 4);
                }
            }

            ctx.save();
            if (gameState === 'pipe_transition' && transitionPipe) {
                ctx.beginPath(); ctx.rect(0, -500, levelWidth > 1000 ? levelWidth : 1000, transitionPipe.y + 500 + 4); ctx.clip();
            }
            ctx.translate(player.x + player.w / 2, player.y + player.h / 2);
            ctx.scale(player.facing, 1);
            
            let cx = -player.w / 2; let cy = -player.h / 2; let pw = player.w; let ph = player.h;
            let swing = !player.grounded ? 1.2 : (Math.abs(player.velX) > 0.5 ? Math.sin(player.walkFrame) : 0);
            let armY = cy + ph * 0.4; let fistY = cy + ph * 0.4 + 10; let buttonY = cy + ph * 0.45 + 2;

            let shirtColor = player.powerState === 2 ? '#FFFFFF' : '#FF0000'; 
            let overallsColor = player.powerState === 2 ? '#FF0000' : '#0000FF'; 

            ctx.fillStyle = shirtColor; ctx.fillRect(cx + 4 + swing * 4, armY, 10, 10); 
            ctx.fillStyle = '#FFCC99'; ctx.fillRect(cx + 4 + swing * 4, fistY, 8, 8); 
            ctx.fillStyle = '#8B4513'; ctx.fillRect(cx + 2 - swing * 7, cy + ph - 10, 12, 10); 
            ctx.fillStyle = '#8B4513'; ctx.fillRect(cx + pw - 14 + swing * 7, cy + ph - 10, 12, 10); 
            
            ctx.fillStyle = overallsColor; ctx.fillRect(cx + 4, cy + 18, pw - 8, ph - 24); 
            ctx.fillStyle = '#FFFF00'; ctx.fillRect(cx + 6, buttonY, 4, 4); ctx.fillRect(cx + pw - 10, buttonY, 4, 4); 
            
            ctx.fillStyle = '#FFCC99'; ctx.fillRect(cx + 4, cy + 8, pw - 6, 12);
            ctx.fillStyle = 'black'; ctx.fillRect(cx + pw - 12, cy + 16, 14, 4); 
            ctx.fillStyle = '#FFCC99'; ctx.fillRect(cx + pw - 4, cy + 12, 6, 6);
            ctx.fillStyle = shirtColor; ctx.fillRect(cx + 2, cy, pw - 6, 8); ctx.fillRect(cx + 6, cy + 6, pw + 4, 4); 
            
            ctx.fillStyle = shirtColor; ctx.fillRect(cx + pw/2 - 2 - swing * 4, armY, 10, 10);
            ctx.fillStyle = '#FFCC99'; ctx.fillRect(cx + pw/2 - 2 - swing * 4, fistY, 8, 8); 
            
            ctx.restore(); 

            if (gameState === 'pipe_transition' && transitionPipe) {
                let p = transitionPipe; ctx.fillStyle = '#00AA00'; ctx.fillRect(p.x, p.y, p.w, 16); ctx.fillStyle = '#00FF00'; ctx.fillRect(p.x + 12, p.y, 8, 16); 
                ctx.strokeStyle = 'black'; ctx.lineWidth = 2; ctx.strokeRect(p.x, p.y, p.w, 16);
            }
            ctx.restore(); 
        }

        function gameLoop() { 
            try {
                update(); 
                draw(); 
            } catch(e) {
                console.error("Game Loop Error:", e);
            }
            requestAnimationFrame(gameLoop); 
        }
        
        startGame(true);
        gameLoop();
    </script>
</body>
